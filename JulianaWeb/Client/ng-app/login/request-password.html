<form name="RequestPasswordForm" ng-submit="vm.requestPassword()">
  <div class="card shadow">
    <div class="card-body">
      <div class="alert alert-danger" ng-if="vm.data.error" role="alert">
        {{vm.data.error}}
      </div>
      <div class="alert alert-success" ng-if="vm.data.success" role="alert">
        {{vm.data.success}}
      </div>
      <!-- <p class="alert alert-info">Enviaremos una clave de acceso su dirección de correo electrónico registrado en la base de datos del software de nómina.</p> -->
      <div class="form-group">
        <label>Usuario:</label>
        <input type="text" class="form-control" name="Cedula" ng-model="vm.viewmodel.cedula" required>
      </div>


      <div class="form-group">
        <div class="custom-control custom-checkbox" style="color: #999">
          <input type="checkbox" class="custom-control-input" id="customCheck1" ng-model="vm.cookiess">
          <label class="custom-control-label" for="customCheck1">
            Acepto
            <a href="{{ROOTURL + 'Static/POLITICA_DE_PRIVACIDAD.pdf'}}" target="_blank">la Política de privacidad</a>.
            <!-- Acepto <a href="#">las Políticas y Terminos de uso</a> y <a href="#">la Política de cookies</a>. -->
          </label>
        </div>
      </div>
      <!-- <a ui-sref="login.noMailValidation">No poseo un correo electronico en el sistema</a> -->
    </div>
    <div class="card-footer" ng-if="!vm.loading">
      <input class="btn btn-primary mb-1" type="submit" id="submit" value="Solicitar clave" ng-disabled="RequestPasswordForm.$invalid || !vm.cookiess || vm.loading"
      />
      <button class="btn float-right mb-1" ui-sref="login">
        <i class="material-icons">launch</i>
        Ir al Login
      </button>
    </div>
    <div class="card-footer" ng-if="vm.loading">
      <div class="float-left">
        <div class="spinner blue">
          <div class="bounce1"></div>
          <div class="bounce2"></div>
          <div class="bounce3"></div>
        </div>
      </div>
    </div>
  </div>



</form>
