<ol class="breadcrumb d-none d-md-flex">
  <li class="breadcrumb-item"><a ui-sref="dashboard"><i class="material-icons">home</i></a></li>
  <li class="breadcrumb-item"><a ui-sref="dashboard">Comprobantes y Certificados</a></li>
  <li class="breadcrumb-item"><a ui-sref="retefuente">Ingresos y Retenciones</a></li>
  <li class="breadcrumb-item active">Configuración</li>
</ol>

<div class="card primary-theme shadow">
  <div class="card-header">
      Seleccione la Empresa
  </div>
  <div class="card-body">
    <div class="form-group">
      <label for="">Empresa:</label>
      <select class="form-control" 
        ng-model="vm.viewmodel.DBName" 
        ng-change="vm.loadEmpleados()"
        ng-options="i.BaseDatos as i.Nombre_Empresa for i in vm.data.empresas"></select>
    </div>
    <div ng-if="vm.config">
      <label class="custom-control custom-checkbox">
        <input type="checkbox" class="custom-control-input" ng-model="vm.config.data.Mostrar_Ano_Anterior">
        <span class="custom-control-indicator"></span>
        <span class="custom-control-label">Mostrar Año anterior</span>
      </label>
      <label class="custom-control custom-checkbox">
        <input type="checkbox" class="custom-control-input" ng-model="vm.config.data.Redondear_Renglones">
        <span class="custom-control-indicator"></span>
        <span class="custom-control-label">Redondear Renglones</span>
      </label>
      <label class="custom-control custom-checkbox">
        <input type="checkbox" class="custom-control-input" ng-model="vm.config.data.Unificar_Contratos">
        <span class="custom-control-indicator"></span>
        <span class="custom-control-label">Unificar Contratos</span>
      </label>
    </div>
  </div>
  <div class="card-footer" ng-if="vm.config">
    <button class="btn btn-success float-right">Guardar</button>
  </div>
</div>
