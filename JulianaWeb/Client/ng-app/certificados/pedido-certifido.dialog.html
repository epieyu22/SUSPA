<div class="ngdialog-header">
  <h5 class="modal-title">Solicitud de Certificado Laboral</h5>
</div>
<div class="ngdialog-body row">
  <div class="col-md-12">
    <p>
      Describe la información que desea que aparezca en el certificado laboral.
      Enviaremos la solicitud al personal de Recursos Humanos.
    </p>
    <textarea class="form-control" rows="6" ng-model="body"></textarea>

  </div>
  <div class="col-md-12 m-t-2 text-right">
    <button type="button" class="btn btn-outline-secondary" ng-click="closeThisDialog()">Cancelar</button>
    <button type="button" class="btn btn-success" ng-disabled="!body" ng-click="Solicitud_Certificdo()">
      Guardar Cambios
    </button>
  </div>
</div>
