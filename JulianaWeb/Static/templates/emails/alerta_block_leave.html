<!DOCTYPE html "-//w3c//dtd xhtml 1.0 transitional //en" "http://www.w3.org/tr/xhtml1/dtd/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<html>

<head>
  <meta charset="UTF-8">
  <style>
    .wrapper {
      background-color: #f1f1f1;
      font-family: Arial, Helvetica, sans-serif;
      border-spacing: 0;
      border-collapse: collapse;
      vertical-align: top;
      height: 100%;
      width: 100%;
      font-size: 16px;
      text-align: justify;
    }

    table {
      width: 100%;
      border: none;
    }

    table td {
      padding: 10px 5px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto
    }

    .content {
      padding: 20px;
      background-color: #fff;
      color: #787878
    }


    h2 {
      margin: 20px auto !important;
      color: #555;
      font-size: 24px;
    }

    a {
      color: #0073cc;
    }

    .button {
      color: #ffffff !important;
      background-color: #0073cc;
      padding: 10px 20px;
      margin: 10px auto;
      text-decoration: none;
      display: inline-block;
      border-radius: 4px;
      -webkit-border-radius: 4px;
    }

    .footer {
      text-align: center;
      color: #999;
      margin-top: 30px;
    }

    .footer p {
      margin: 5px auto;
    }

    img {
      margin: 0 auto;
    }

    @media only screen and (max-width: 600px) {
      .container {
        max-width: 100%;
        margin: inherit 5px;
      }
    }
  </style>
</head>

<body>
  <table class="wrapper">
    <tbody>
      <tr>
        <td>
          <div class="container" style="margin: 10px auto">
            <img src="cid:logo_empresa" alt="LogoEmpresa" width="150px">
            <img src="cid:logo_juliana" alt="LogoEmpresa" style="display: none">
          </div>
        </td>
      </tr>
      <tr>
        <td>
          <h2 class="container">Alerta Block Leave</h2>
          <div class=" container content">
            <p>No ha realizado una solicitud de vacaciones para este periodo que cumpla con las politicas de <b>Block Leave</b>.</p>
            <div style="text-align: center">
              <a href="@callbackurl" class="button">Hacer Solicitud desde Juliana</a>
            </div>
          </div>
        </td>
      </tr>
      <tr>
        <td>

          <div class="contaier footer">
            <div>
              <img src="http://systemsltda.com/wp-content/themes/systemssas/images/logo_medium.png" alt="logo systems" width="200px">
            </div>
            <div>
              <p>Este correo es generado automáticamente, no responder.</p>
              <a href="http://systemsltda.com">Systems Integrated Solutions S.A.S</a>
            </div>
            <p>&copy; @ano</p>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</body>

</html>
